# Builds the server and runs the tests that do not need installed game files (.github/ci-excluded-tests.txt lists the ones
# that do). Every step of a required job (versions, encounter-catalog, new-client, server, launcher) is a gate: it fails
# when its check fails or when its input is missing. Report-only steps are in jobs whose name starts with "report"; none of
# them is required. docs/CI.md lists each job and what it gates (issue #618).
name: build-and-test

on:
  # Every push, main included, so main is tested again after each merge.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # README.md, ForkBuildInfo.BuildName and the newest released changelog heading must name the same release (audit
  # 2026-11-03 §8.6; main said Beta 1.1 after 1.1.1 was out), and MainForm.DisplayVersion must read that build
  # (LauncherBuild.Name), never a pinned version. Also the release scripts' own tests.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the README and release versions agree
        run: |
          python3 tools/release/check_versions.py
          python3 tools/release/check_brand.py
          python3 tools/release/check_brand.py --internal
          python3 -m unittest discover -s tools/release/tests -v
          python3 -m unittest discover -s tools/installer/tests -v

  # The epic encounter catalog (docs/encounters) must match the boss scripts it was read from: a script change without
  # a regenerated catalog, or with a hand check now out of date, fails here (source/tools/epic_encounter_catalog.py).
  encounter-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # a pull request's merge commit and main before it (the generated-file guard, #817)
      - name: Check the epic encounter catalog is up to date
        run: |
          python3 source/tools/epic_encounter_catalog.py --check
          python3 -m unittest discover -s source/tools/tests -v
      # Issue #615: each pull request adds a changelog.d/*.md fragment instead of editing the changelog; every fragment
      # must parse (front matter: version, section) and name a version still in development (changelog.d/README.md).
      - name: Check the changelog fragments
        run: python3 source/tools/assemble_changelog.py --check
      # Issue #628: the Grafana dashboards are what the server code makes them (tools/grafana/kit.py), every row the kit
      # reads builds, and the privacy filter drops what it must on synthetic lines. #817: docs/LOG-ROWS.md and the Alloy
      # allowlist are built here but not compared: main regenerates them after each merge (generated-files.yml).
      - name: The pull request doesn't commit the files main generates
        if: github.event_name == 'pull_request' && github.head_ref != 'bot/generated-files'
        run: python3 tools/grafana/generated_guard.py --base HEAD^1
      - name: Check the Grafana kit
        run: |
          python3 tools/grafana/kit.py --check
          python3 -m unittest discover -s tools/grafana/tests -v
      # Issue #649: the Grafana Cloud kit's detect, env check, install dry runs and config checks. ubuntu-latest has pwsh,
      # so the Windows scripts are parsed and dry-run too; ALLOY_BIN (not set here) would also run a real Alloy.
      - name: Grafana Cloud kit tests
        run: |
          python3 tools/grafana/cloud/dashboards.py --check
          python3 -m unittest discover -s tools/grafana/cloud/tests -v

  # The new client as a 0.37c player gets it: the released scripts with tools/fork-build/content-patches.json applied
  # must all compile in Godot against the released class cache, and issue #34's probe (skills onto the quickbar,
  # Stealth, the merchant's SELL) must pass. tools/newclient-compat/installed_check.py; no game content needed.
  new-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the 0.37 release commit (the released scripts)
        run: git fetch --depth=1 origin ab4df02a1ad26192357477dbc912756c6703fb66
      - name: Godot 4.7.2 (SHA-512 from its release page)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Installed scripts compile, issue #34 probe
        run: python3 tools/newclient-compat/installed_check.py "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/installed"

  server:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The embedded bot-voice corpus must be what its .lines sources build, and names chosen in code
      # must pass the corpus's out-of-era rules (audit 2026-10-16).
      - name: Check the bot-voice corpus and runtime names
        shell: bash
        run: |
          python tools/bot-voices/build_corpus.py --verify
          python tools/bot-voices/check_runtime_names.py
          python tools/bot-voices/debates_doc.py --check
          # Issue #475: no new bot line may leave outside the say gate (BotSayGate.Say), and raw sends in bots/ may only fall.
          python tools/bot-voices/say_gate_ratchet.py
          python -m unittest discover -s tools/bot-voices/tests -v
          python -m unittest discover -s tools/lore/tests -v
          # 1.2.1 lore checks beside the lint (which the tests above run): the repetition ratchet and the reachability caps
          # fail, and so does the continuity ledger (docs/1.2.1/CONTINUITY.md; clean since 2026-11-22).
          python tools/lore/lint_lore.py
          python tools/lore/repetition.py --check
          python tools/lore/reachability.py --check
          python tools/lore/continuity.py --check
          python tools/lore/depth_report.py --check
          python -m unittest discover -s tools/claude-version/tests -v
          python -m unittest discover -s tools/perf/tests -v

      - name: Create local server config (build only needs it to exist)
        shell: bash
        run: cp source/server/CoreServer/config/serverconfig.example.xml source/server/CoreServer/config/serverconfig.xml

      - name: Build server
        # SourceRevisionId stamps the commit into the build; the server logs it at startup (FORK_BUILD).
        run: dotnet build "source/server/Dawn of Light.sln" -c Release -p:SourceRevisionId=${{ github.sha }}

      # Tests listed in .github/ci-excluded-tests.txt read the installed navmeshes and database (the /runtime/ folder, which
      # is never in git); each entry says why and links its issue, or the filter step fails. Run those on your own PC.
      - name: Test server (without installed-game-file tests)
        shell: bash
        run: |
          filter=$(python source/tools/ci_test_results.py excluded-filter .github/ci-excluded-tests.txt)
          dotnet test source/server/Tests/Tests.csproj -c Release --no-build ${filter:+--filter "$filter"} --results-directory TestResults --logger "trx;LogFileName=server.trx"

      # Issue #618: read from the results the step above wrote, no second run. Fails when the file is missing, when fewer
      # tests ran than the floor (a filter that drops most of the suite is not a pass; about 10 170 run in 1.2.3), or when
      # any failed. Then the feature tests of this branch (REPORT_TEST_CLASSES) and the passport lock: each class must have
      # tests in the results, and every one must pass. The failures' first lines go on the run page.
      - name: Server test results, feature tests and the passport lock
        if: always()
        shell: bash
        run: |
          rc=0
          python source/tools/ci_test_results.py trx TestResults/server.trx --title "Server tests" --min-executed 9000 || rc=1
          classes="${REPORT_TEST_CLASSES:-UT_AutonomousBotGuild UT_AutonomousBotPersonality UT_AutonomousBotVoices UT_AutonomousLivingServer UT_LevelRangeXpRates UT_BotXpRateSeparation}"
          python source/tools/ci_test_results.py trx TestResults/server.trx --title "Feature tests" --classes "$classes" || rc=1
          python source/tools/ci_test_results.py trx TestResults/server.trx --title "Passport lock and desk tests (server)" --classes UT_PassportLock || rc=1
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: "**/TestResults/*.trx"

      # The simulated transcripts (UT_FactionCoherence, UT_ChatEngagement, UT_ChatSpeakerFit, UT_ChatVoiceAfterRC5) go to the
      # "report: chat audit" job below, which reads them with source/tools/chat_audit.py. Missing ones fail here (#618):
      # each test that writes one passed above, so a missing transcript means it wrote somewhere else or stopped writing.
      - name: The simulated chat transcripts exist
        if: always()
        shell: bash
        run: |
          logs=$(python source/tools/ci_test_results.py require --title "Chat audit" \
            chat-sim/faction-sim-before.chat.log chat-sim/faction-sim-after.chat.log \
            chat-sim/faction-sim-engage-before.chat.log chat-sim/faction-sim-engage-after.chat.log \
            chat-sim/faction-sim-channels-before.chat.log chat-sim/faction-sim-channels-after.chat.log \
            chat-sim/faction-sim-voice-before.chat.log chat-sim/faction-sim-voice-after.chat.log) || { echo "$logs"; exit 1; }
          mkdir -p chat-sim
          for f in $logs; do cp "$f" chat-sim/; done
          ls chat-sim

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-sim
          path: chat-sim/
          if-no-files-found: error

      # Realism 1b (#477; docs/realism-audit-1.2.3/evenings.md): the player's evenings (UT_ChatBudgetSimulation.PlaysThePlayersEvenings,
      # 18 two-hour evenings as one player reads them) read by evening_read.py, whose seven judgement-free counts may not get worse
      # than tools/bot-voices/eval/evening_ratchet.json. Synthetic bots only, no played world; tests only.
      - name: Evening transcripts ratchet
        if: always()
        shell: bash
        run: |
          # A missing evenings.tsv, or a metrics script that crashes, fails the step like the ratchet does (#618).
          rows=$(python source/tools/ci_test_results.py require --title "Evening transcripts" evening-transcripts/evenings.tsv | head -n 1) || { echo "$rows"; exit 1; }
          mkdir -p evening-transcripts
          cp "$rows" evening-transcripts/
          python tools/bot-voices/eval/evening_read.py "$rows" --metrics > evening-transcripts/metrics.txt
          python tools/bot-voices/eval/evening_read.py "$rows" --ratchet --github

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evening-transcripts
          path: evening-transcripts/
          if-no-files-found: warn

      # #644 part 6: the raid sims write their attempts as the server's RAID_* rows (UT_SimRaidRows644, raid-sim/*.raid.log).
      # They are read with the same parser as a server log: every row has the server's fields in order, every simulated
      # attempt has its pull and end, and the death counts agree. A missing log fails here (#618). Tests only: a sim is a model.
      - name: The simulated raid rows read like a server log
        if: always()
        shell: bash
        run: |
          logs=$(python source/tools/ci_test_results.py require --title "Raid sim rows" 'raid-sim/*.raid.log') || { echo "$logs"; exit 1; }
          mkdir -p raid-sim
          for f in $logs; do [ "$f" -ef "raid-sim/$(basename "$f")" ] || cp "$f" raid-sim/; done
          python source/tools/raid_postmortem.py --check --github raid-sim/*.raid.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raid-sim
          path: raid-sim/
          if-no-files-found: warn

      # 1.2.2 chat audit (docs/bot-voices/CHAT-AUDIT-1.2.2.md): the player questions of tools/bot-voices/eval/player_questions.json
      # answered through the server's own reply path (UT_ChatQuestionBench runs AutonomousChatReplyPath) and scored. Since the 1.2.2
      # fixes it is a ratchet: the build fails when the good share falls or a bad category grows past bench_ratchet.json's caps.
      # Realism 1b (#477): the bench holds the realism audit's fresh lines too (the headline), reports good / wrong / non-answer /
      # silent per kind and per channel, and ratchets the side benches: the same questions in every channel, the 54 follow-ups,
      # the 40 lines of the moment and the two-line bench (context_lines.json). The holdout set (fresh lines held out) is reported
      # beside it. The written lines are scanned for fluff and clunky patterns (report only).
      - name: Chat question bench ratchet
        if: always()
        shell: bash
        run: |
          # Every bench file must be there (#618: a missing holdout or side bench was a warning, and the ratchet then skipped it).
          # The bench report and the line scan only report (they exit 0 on what they find), but a crash fails the step.
          files=$(python source/tools/ci_test_results.py require --title "Chat question bench" chat-bench/bench-replies.json \
            chat-bench/bench-holdout.json chat-bench/bench-channels.json chat-bench/bench-followups.json \
            chat-bench/bench-moments.json chat-bench/bench-twoline.json) || { echo "$files"; exit 1; }
          pick() { echo "$files" | grep "/$1\$" | head -n 1; }
          replies=$(pick bench-replies.json)
          holdout=$(pick bench-holdout.json)
          mkdir -p chat-bench
          cp "$replies" "$holdout" chat-bench/
          python tools/bot-voices/eval/score_bench.py bench "$replies" --json chat-bench/bench-score.json --md chat-bench/bench-score.md > /dev/null
          python tools/bot-voices/eval/score_bench.py lines --json chat-bench/lines-scan.json
          sides=""
          for side in channels followups moments twoline; do
            f=$(pick "bench-$side.json")
            cp "$f" chat-bench/
            sides="$sides --$side $f"
          done
          python tools/bot-voices/eval/score_bench.py ratchet "$replies" --holdout "$holdout" $sides --github --json chat-bench/ratchet.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-bench
          path: chat-bench/
          if-no-files-found: warn

      # The launcher ships in the build too (its Living Server tab, from 1.1.2 its update check, from 1.2 Host for Friends
      # and Join Friend, from 1.2 also Crafting 2.0's economy page, bot purge and level-50 kit). Their own tests must pass,
      # and every class of the filter must have tests in the results (#618: a renamed class used to drop out of the filter
      # unseen). All the launcher tests run in the launcher job below, which is a gate too.
      - name: Build launcher and test the Living Server tab
        shell: bash
        run: |
          dotnet build source/tools/DAoCLivingServer.Launcher/DAoCLivingServer.Launcher.csproj -c Release -p:SourceRevisionId=${{ github.sha }}
          classes="SocialExpansionSettingsTests HeraldPageTests LoreBestiaryTests Tests.Update HostForFriendsTests JoinFriendTests JoinFriendFormTests GmAccessTests HostForFriendsFirewallTests CraftingEconomyLauncherTests LauncherWindowSizeTests"
          filter=""
          for c in $classes; do filter="${filter:+$filter|}FullyQualifiedName~$c"; done
          rc=0
          dotnet test source/tools/DAoCLivingServer.Launcher.Tests/DAoCLivingServer.Launcher.Tests.csproj -c Release -p:SourceRevisionId=${{ github.sha }} --filter "$filter" --results-directory TestResults --logger "trx;LogFileName=launcher-tab.trx" || rc=1
          python source/tools/ci_test_results.py trx TestResults/launcher-tab.trx --title "Living Server tab tests" --classes "$classes" || rc=1
          exit $rc

      # Real renders of the launcher's settings tabs and the Living Server tab (RendersPreviewsBesideTheOtherSettingsTabs).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-ui-preview
          path: |
            **/ui-preview/*.png
            **/ui-preview/*.html
          if-no-files-found: warn

      # Character passport (1.2, docs/CHARACTER-PASSPORT.md): the shared library the server and the launcher compile, its
      # command line tool, and its tests on synthetic saves (round trip, no duplication, rollback, backups, and a decision
      # for every table of progress-policy.json).
      - name: Test the character passport
        shell: bash
        run: |
          # The server's passport lock tests (UT_PassportLock) gate in the server test results step above (#618; they were
          # run a second time here with "|| true").
          dotnet build source/tools/DAoCLivingServer.Passport.Cli/DAoCLivingServer.Passport.Cli.csproj -c Release
          rc=0
          dotnet test source/tools/DAoCLivingServer.Passport.Tests/DAoCLivingServer.Passport.Tests.csproj -c Release --results-directory TestResults --logger "trx;LogFileName=passport.trx" || rc=1
          python source/tools/ci_test_results.py trx TestResults/passport.trx --title "Character passport tests" || rc=1
          exit $rc

      # Progress transfer (DAoCLivingServer.ProgressImport): its engine's tests on synthetic saves (1.2: a play test sweep's
      # guest record is never carried, so a transfer can't give GM back).
      - name: Test the progress transfer engine
        shell: bash
        run: |
          rc=0
          dotnet test source/tools/DAoCLivingServer.ProgressImport.Tests/DAoCLivingServer.ProgressImport.Tests.csproj -c Release --results-directory TestResults --logger "trx;LogFileName=progress-transfer.trx" || rc=1
          python source/tools/ci_test_results.py trx TestResults/progress-transfer.trx --title "Progress transfer tests" || rc=1
          exit $rc

      # The source-world tool (DAoCLivingServer.Setup: a world from the OpenDAoC SQL plus the Classic 1.65 restores). The
      # installer and the release packages don't run it, so nothing else compiled it and #725 went unseen; build it here.
      - name: Build the source-world Setup tool
        shell: bash
        run: dotnet build source/tools/DAoCLivingServer.Setup/DAoCLivingServer.Setup.csproj -c Release

      # Only after every server test passed: the installable server build (docs/RELEASE-PLAN.md).
      - name: Package the server build
        id: package
        shell: pwsh
        run: |
          $name = (Select-String -Path source/server/GameServer/gameutils/ForkBuildInfo.cs -Pattern 'BuildName = "([^"]+)"').Matches[0].Groups[1].Value
          $base = (Select-String -Path source/server/GameServer/gameutils/ForkBuildInfo.cs -Pattern 'BaseRelease = "([^"]+)"').Matches[0].Groups[1].Value
          if (!$name -or !$base) { throw "No build name or base release in ForkBuildInfo.cs" }
          $short = "${{ github.sha }}".Substring(0, 7)
          $dir = "package/LivingServer-$name"
          New-Item -ItemType Directory -Path "$dir/tools/claude-version", "$dir/docs" -Force | Out-Null
          $built = "source/server/Release/lib"
          if (!(Test-Path "$built/GameServer.dll")) { throw "No GameServer.dll in $built" }
          Copy-Item "$built/GameServer.dll", "$built/GameServer.pdb" $dir
          Copy-Item tools/fork-build/INSTALL.cmd, tools/fork-build/ROLLBACK.cmd, tools/fork-build/PREPARE-FOR-UPDATE.cmd, tools/fork-build/install-server-build.ps1, tools/fork-build/rollback-server-build.ps1, tools/fork-build/fork-build-common.ps1, tools/fork-build/README.txt, tools/fork-build/content-patches.json $dir
          # Whole files the content patches ship (content-patches.json "File" entries): Living Server's loading screen.
          Copy-Item tools/fork-build/content "$dir/content" -Recurse
          Copy-Item tools/claude-version/set_bot_guilds.py, tools/claude-version/set_bot_social.py, tools/claude-version/set_xp_by_level.py, tools/claude-version/carry_social_tables.py, tools/claude-version/epic_chains.py, tools/claude-version/epic_chains_data.json, tools/claude-version/lore_books.py "$dir/tools/claude-version"
          Copy-Item docs/BOT-GUILDS.md, docs/BOT-PERSONALITIES.md, docs/XP-BY-LEVEL-RANGE.md, docs/LIVING-SERVER.md, docs/KNOWN-ISSUES.md, docs/PLAY-WITH-FRIENDS.md "$dir/docs"
          $launcher = "source/tools/DAoCLivingServer.Launcher/bin/Release/net10.0-windows"
          New-Item -ItemType Directory -Path "$dir/launcher" -Force | Out-Null
          $launcherInfo = @()
          # DAoCLivingServer.* from 1.2.3 (#641), plus OfflineDAoC.exe: a byte copy of the apphost, which runs
          # DAoCLivingServer.dll whatever its own name, for the game's start file, old shortcuts and 1.2.x updaters.
          foreach ($file in 'DAoCLivingServer.dll', 'DAoCLivingServer.exe', 'DAoCLivingServer.pdb', 'DAoCLivingServer.deps.json', 'DAoCLivingServer.runtimeconfig.json') {
            if (!(Test-Path "$launcher/$file")) { throw "No $file in $launcher" }
            Copy-Item "$launcher/$file" "$dir/launcher"
          }
          Copy-Item "$dir/launcher/DAoCLivingServer.exe" "$dir/launcher/OfflineDAoC.exe"
          foreach ($file in 'DAoCLivingServer.dll', 'DAoCLivingServer.exe', 'DAoCLivingServer.pdb', 'DAoCLivingServer.deps.json', 'DAoCLivingServer.runtimeconfig.json', 'OfflineDAoC.exe') {
            $launcherInfo += "launcher/$file=$((Get-FileHash "$dir/launcher/$file" -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          # The server's own libraries (1.1.2 on): a GameServer.dll built against changed ones fails at start beside the
          # released ones (playtest 2026-11-04), so they always ship with it.
          New-Item -ItemType Directory -Path "$dir/core" -Force | Out-Null
          $coreInfo = @()
          foreach ($file in "lib/CoreBase.dll", "lib/CoreBase.pdb", "lib/CoreDatabase.dll", "lib/CoreDatabase.pdb", "CoreServer.dll", "CoreServer.pdb") {
            $from = "source/server/Release/$file"
            if (!(Test-Path $from)) { throw "No $from" }
            Copy-Item $from "$dir/core"
            $leaf = Split-Path -Leaf $file
            $coreInfo += "core/$leaf=$((Get-FileHash "$dir/core/$leaf" -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          $dll = (Get-FileHash "$dir/GameServer.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $pdb = (Get-FileHash "$dir/GameServer.pdb" -Algorithm SHA256).Hash.ToLowerInvariant()
          $content = (Get-FileHash "$dir/content-patches.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$dir/BUILD-INFO.txt" -Encoding UTF8 -Value (@(
            "BuildName=$name", "BaseRelease=$base", "Commit=${{ github.sha }}", "Branch=${{ github.ref_name }}",
            "Built=$((Get-Date).ToUniversalTime().ToString('o'))", "GameServer.dll=$dll", "GameServer.pdb=$pdb",
            "content-patches.json=$content") + $coreInfo + $launcherInfo)
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "artifact=OfflineDAoC-LivingServer-$name-$short" >> $env:GITHUB_OUTPUT
          Write-Host "::notice title=Server build package::$name commit $short GameServer.dll sha256 $dll"

      - name: Test the installer (Windows PowerShell 5.1, fake game folders)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/fork-build/test-install-scripts.ps1 -BuildDir "${{ steps.package.outputs.dir }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "::notice title=Installer tests::all installer checks passed"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: package/
          retention-days: 90

  # The 1.2 gate's Install rows as tests (candidate-install.yml): this commit's package installed new the way a player gets
  # it, the class-off (0.37) edition checked on it, and a 1.1.4 game updated to it through Setup with its saves kept.
  # About 30-45 minutes of Windows runners with real downloads, so only for the candidate line (main, integration/1.2,
  # release/*), for ci/* branches (pull requests that change these checks push one) and by hand; not for the dispatched
  # runs of bot/generated-files, which changes only two generated docs (#817).
  candidate-install:
    needs: server
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name != 'bot/generated-files') ||
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'integration/1.2' ||
        startsWith(github.ref_name, 'release/') || startsWith(github.ref_name, 'ci/')))
    concurrency:
      group: candidate-install-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/candidate-install.yml
    with:
      package_artifact: ${{ needs.server.outputs.artifact }}

  # The frozen update contract (update-contract.yml, #685): the newest released launcher and Setup take this commit's
  # package as their update. About 5 runner minutes, no game download, so on every push and pull request.
  update-contract:
    needs: server
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/update-contract.yml
    with:
      package_artifact: ${{ needs.server.outputs.artifact }}

  # Every launcher test. A required check and a gate since #618: 58d407288 (2026-10-12) made the job continue-on-error
  # ("some launcher tests expect a particular local setup"), so a failing test still left the run green. All 411 tests
  # pass on a clean runner (1.2.3), and a test that needs a local setup must say so itself (Assume / Ignore), not hide the
  # job. Fewer than 400 tests run fails too: a project that stops finding its tests is not a pass.
  launcher:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test launcher
        shell: bash
        run: |
          rc=0
          dotnet test source/tools/DAoCLivingServer.Launcher.Tests/DAoCLivingServer.Launcher.Tests.csproj -c Release --results-directory TestResults --logger "trx;LogFileName=launcher.trx" || rc=1
          python source/tools/ci_test_results.py trx TestResults/launcher.trx --title "Launcher tests" --min-executed 400 || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  # Report only, never required (#618): source/tools/chat_audit.py's verdicts on the simulated transcripts the server job
  # wrote. The C# tests that write them are the gate (each asserts its own numbers); a "before" transcript is the old
  # scheduling and fails the audit on purpose, and the channels transcript has no repliers, so its unanswered-question
  # verdict is not a defect. A missing transcript fails the server job; a crash of the audit fails this job.
  report-chat-audit:
    name: "report: chat audit"
    needs: server
    if: always() && needs.server.result != 'skipped' && needs.server.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chat-sim
          path: chat-sim
      - name: "Report: audit the simulated /faction evenings"
        run: |
          set -o pipefail
          mkdir -p chat-audit
          python3 source/tools/chat_audit.py chat-sim/*.chat.log --github --show 3 --json chat-audit/chat-audit.json | tee chat-audit/chat-audit.txt
          cp chat-sim/*.chat.log chat-audit/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-audit
          path: chat-audit/
          if-no-files-found: error
