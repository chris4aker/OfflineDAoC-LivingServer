# Builds the server and runs the tests that do not need installed game files.
# Draft CI: first runs may need small fixes. See .github/ci-excluded-tests.txt.
name: build-and-test

on:
  # Every push, main included, so main is tested again after each merge.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # README.md, ForkBuildInfo.BuildName, MainForm.DisplayVersion and the newest released changelog heading must name the
  # same release (audit 2026-11-03 §8.6; main said Beta 1.1 after 1.1.1 was out). Also the release scripts' own tests.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the README and release versions agree
        run: |
          python3 tools/release/check_versions.py
          python3 -m unittest discover -s tools/release/tests -v

  # The epic encounter catalog (docs/encounters) must match the boss scripts it was read from: a script change without
  # a regenerated catalog, or with a hand check now out of date, fails here (source/tools/epic_encounter_catalog.py).
  encounter-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the epic encounter catalog is up to date
        run: |
          python3 source/tools/epic_encounter_catalog.py --check
          python3 -m unittest discover -s source/tools/tests -v

  # The new client as a 0.37c player gets it: the released scripts with tools/fork-build/content-patches.json applied
  # must all compile in Godot against the released class cache, and issue #34's probe (skills onto the quickbar,
  # Stealth, the merchant's SELL) must pass. tools/newclient-compat/installed_check.py; no game content needed.
  new-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the 0.37 release commit (the released scripts)
        run: git fetch --depth=1 origin ab4df02a1ad26192357477dbc912756c6703fb66
      - name: Godot 4.7.2 (SHA-512 from its release page)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Installed scripts compile, issue #34 probe
        run: python3 tools/newclient-compat/installed_check.py "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/installed"

  server:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The embedded bot-voice corpus must be what its .lines sources build, and names chosen in code
      # must pass the corpus's out-of-era rules (audit 2026-10-16).
      - name: Check the bot-voice corpus and runtime names
        shell: bash
        run: |
          python tools/bot-voices/build_corpus.py --verify
          python tools/bot-voices/check_runtime_names.py
          python -m unittest discover -s tools/claude-version/tests -v
          python -m unittest discover -s tools/perf/tests -v

      - name: Create local server config (build only needs it to exist)
        shell: bash
        run: cp source/server/CoreServer/config/serverconfig.example.xml source/server/CoreServer/config/serverconfig.xml

      - name: Build server
        # SourceRevisionId stamps the commit into the build; the server logs it at startup (FORK_BUILD).
        run: dotnet build "source/server/Dawn of Light.sln" -c Release -p:SourceRevisionId=${{ github.sha }}

      # Tests listed in .github/ci-excluded-tests.txt read the installed navmeshes and
      # database (the /runtime/ folder, which is never in git). Run those on your own PC.
      - name: Test server (without installed-game-file tests)
        shell: bash
        run: |
          filter=""
          while IFS= read -r name; do
            name="${name%$'\r'}"
            [ -z "$name" ] && continue
            filter="${filter:+$filter&}FullyQualifiedName!~.$name"
          done < .github/ci-excluded-tests.txt
          dotnet test source/server/Tests/Tests.csproj -c Release --no-build --filter "$filter" --logger "trx;LogFileName=server.trx"

      # Puts the test counts on the run page as notices (readable without downloading artifacts).
      - name: Report test counts
        if: always()
        shell: bash
        run: |
          trx=$(find . -path '*TestResults*' -name 'server.trx' | head -n 1)
          if [ -n "$trx" ]; then
            # GitHub runs bash with -e and pipefail: a grep with no match must not fail the step
            counters=$(grep -o '<Counters [^>]*>' "$trx" | head -n 1 || true)
            get() { echo "$counters" | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*' || true; }
            echo "::notice title=Server tests::total $(get total), executed $(get executed), passed $(get passed), failed $(get failed)"
            failedAll=$(grep -o '<UnitTestResult [^>]*outcome="Failed"[^>]*>' "$trx" | grep -o 'testName="[^"]*"' | sed 's/testName=//; s/"//g' | head -n 10 | paste -sd ';' - || true)
            if [ -n "$failedAll" ]; then echo "::warning title=Failed server tests::$failedAll"; fi
          else
            echo "::warning title=Server tests::No test results file found"
          fi
          # Re-run the tests of the feature on this branch so their own count is visible too.
          classes="${REPORT_TEST_CLASSES:-UT_AutonomousBotGuild UT_AutonomousBotPersonality UT_AutonomousBotVoices UT_AutonomousLivingServer UT_LevelRangeXpRates UT_BotXpRateSeparation}"
          filter=""
          for c in $classes; do filter="${filter:+$filter|}FullyQualifiedName~$c"; done
          out=$(dotnet test source/server/Tests/Tests.csproj -c Release --no-build --filter "$filter" 2>&1 || true)
          summary=$(echo "$out" | grep -E "(Passed|Failed)!" | tail -n 1 || true)
          echo "::notice title=Feature tests ($classes)::${summary:-no summary line found}"
          failed=$(echo "$out" | grep -E "^\s*Failed [A-Za-z_]" | sed -E 's/^\s*Failed //; s/ \[.*//' | head -n 10 | paste -sd ';' - || true)
          if [ -n "$failed" ]; then echo "::warning title=Failed feature tests::$failed"; fi
          # First line of each failure's error message (the logs and artifacts may not be readable).
          echo "$out" | awk '/^[[:space:]]*Failed [A-Za-z_]/{name=$2} /Error Message:/{if ((getline line) > 0) {gsub(/^[[:space:]]+/, "", line); print name ": " substr(line, 1, 300)}}' | head -n 10 | while IFS= read -r line; do echo "::warning title=Feature test error::$line"; done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: "**/TestResults/*.trx"

      # The launcher ships in the build too (its Living Server tab and, from 1.1.2, its update check). Their own tests
      # must pass; the rest of the launcher tests run in the informational launcher job below.
      - name: Build launcher and test the Living Server tab
        shell: bash
        run: |
          dotnet build source/tools/OfflineDaoc.Launcher/OfflineDaoc.Launcher.csproj -c Release -p:SourceRevisionId=${{ github.sha }}
          out=$(dotnet test source/tools/OfflineDaoc.Launcher.Tests/OfflineDaoc.Launcher.Tests.csproj -c Release -p:SourceRevisionId=${{ github.sha }} --filter "FullyQualifiedName~SocialExpansionSettingsTests|FullyQualifiedName~HeraldPageTests|FullyQualifiedName~LoreBestiaryTests|FullyQualifiedName~Tests.Update" 2>&1) || { echo "$out"; echo "::error title=Living Server tab tests::failed"; exit 1; }
          summary=$(echo "$out" | grep -E "(Passed|Failed)!" | tail -n 1 || true)
          echo "::notice title=Living Server tab tests::${summary:-no summary line found}"

      # Real renders of the launcher's settings tabs and the Living Server tab (RendersPreviewsBesideTheOtherSettingsTabs).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-ui-preview
          path: |
            **/ui-preview/*.png
            **/ui-preview/*.html
          if-no-files-found: warn

      # Character passport (1.2, docs/CHARACTER-PASSPORT.md): the shared library the server and the launcher compile, its
      # command line tool, and its tests on synthetic saves (round trip, no duplication, rollback, backups, and a decision
      # for every table of progress-policy.json).
      - name: Test the character passport
        shell: bash
        run: |
          dotnet build source/tools/OfflineDaoc.Passport.Cli/OfflineDaoc.Passport.Cli.csproj -c Release
          out=$(dotnet test source/tools/OfflineDaoc.Passport.Tests/OfflineDaoc.Passport.Tests.csproj -c Release 2>&1) || { echo "$out"; echo "::error title=Character passport tests::failed"; exit 1; }
          summary=$(echo "$out" | grep -E "(Passed|Failed)!" | tail -n 1 || true)
          echo "::notice title=Character passport tests::${summary:-no summary line found}"
          server=$(dotnet test source/server/Tests/Tests.csproj -c Release --no-build --filter "FullyQualifiedName~UT_PassportLock" 2>&1 || true)
          echo "::notice title=Passport lock and desk tests (server)::$(echo "$server" | grep -E "(Passed|Failed)!" | tail -n 1 || true)"

      # Only after every server test passed: the installable server build (docs/RELEASE-PLAN.md).
      - name: Package the server build
        id: package
        shell: pwsh
        run: |
          $name = (Select-String -Path source/server/GameServer/gameutils/ForkBuildInfo.cs -Pattern 'BuildName = "([^"]+)"').Matches[0].Groups[1].Value
          $base = (Select-String -Path source/server/GameServer/gameutils/ForkBuildInfo.cs -Pattern 'BaseRelease = "([^"]+)"').Matches[0].Groups[1].Value
          if (!$name -or !$base) { throw "No build name or base release in ForkBuildInfo.cs" }
          $short = "${{ github.sha }}".Substring(0, 7)
          $dir = "package/LivingServer-$name"
          New-Item -ItemType Directory -Path "$dir/tools/claude-version", "$dir/docs" -Force | Out-Null
          $built = "source/server/Release/lib"
          if (!(Test-Path "$built/GameServer.dll")) { throw "No GameServer.dll in $built" }
          Copy-Item "$built/GameServer.dll", "$built/GameServer.pdb" $dir
          Copy-Item tools/fork-build/INSTALL.cmd, tools/fork-build/ROLLBACK.cmd, tools/fork-build/PREPARE-FOR-UPDATE.cmd, tools/fork-build/install-server-build.ps1, tools/fork-build/rollback-server-build.ps1, tools/fork-build/fork-build-common.ps1, tools/fork-build/README.txt, tools/fork-build/content-patches.json $dir
          # Whole files the content patches ship (content-patches.json "File" entries): Living Server's loading screen.
          Copy-Item tools/fork-build/content "$dir/content" -Recurse
          Copy-Item tools/claude-version/set_bot_guilds.py, tools/claude-version/set_bot_social.py, tools/claude-version/set_xp_by_level.py, tools/claude-version/carry_social_tables.py, tools/claude-version/epic_chains.py, tools/claude-version/epic_chains_data.json, tools/claude-version/lore_books.py "$dir/tools/claude-version"
          Copy-Item docs/BOT-GUILDS.md, docs/BOT-PERSONALITIES.md, docs/XP-BY-LEVEL-RANGE.md, docs/LIVING-SERVER.md, docs/KNOWN-ISSUES.md "$dir/docs"
          $launcher = "source/tools/OfflineDaoc.Launcher/bin/Release/net10.0-windows"
          New-Item -ItemType Directory -Path "$dir/launcher" -Force | Out-Null
          $launcherInfo = @()
          foreach ($file in 'OfflineDAoC.dll', 'OfflineDAoC.exe', 'OfflineDAoC.pdb', 'OfflineDAoC.deps.json', 'OfflineDAoC.runtimeconfig.json') {
            if (!(Test-Path "$launcher/$file")) { throw "No $file in $launcher" }
            Copy-Item "$launcher/$file" "$dir/launcher"
            $launcherInfo += "launcher/$file=$((Get-FileHash "$dir/launcher/$file" -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          # The server's own libraries (1.1.2 on): a GameServer.dll built against changed ones fails at start beside the
          # released ones (playtest 2026-11-04), so they always ship with it.
          New-Item -ItemType Directory -Path "$dir/core" -Force | Out-Null
          $coreInfo = @()
          foreach ($file in "lib/CoreBase.dll", "lib/CoreBase.pdb", "lib/CoreDatabase.dll", "lib/CoreDatabase.pdb", "CoreServer.dll", "CoreServer.pdb") {
            $from = "source/server/Release/$file"
            if (!(Test-Path $from)) { throw "No $from" }
            Copy-Item $from "$dir/core"
            $leaf = Split-Path -Leaf $file
            $coreInfo += "core/$leaf=$((Get-FileHash "$dir/core/$leaf" -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          $dll = (Get-FileHash "$dir/GameServer.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $pdb = (Get-FileHash "$dir/GameServer.pdb" -Algorithm SHA256).Hash.ToLowerInvariant()
          $content = (Get-FileHash "$dir/content-patches.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$dir/BUILD-INFO.txt" -Encoding UTF8 -Value (@(
            "BuildName=$name", "BaseRelease=$base", "Commit=${{ github.sha }}", "Branch=${{ github.ref_name }}",
            "Built=$((Get-Date).ToUniversalTime().ToString('o'))", "GameServer.dll=$dll", "GameServer.pdb=$pdb",
            "content-patches.json=$content") + $coreInfo + $launcherInfo)
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "artifact=OfflineDAoC-LivingServer-$name-$short" >> $env:GITHUB_OUTPUT
          Write-Host "::notice title=Server build package::$name commit $short GameServer.dll sha256 $dll"

      - name: Test the installer (Windows PowerShell 5.1, fake game folders)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/fork-build/test-install-scripts.ps1 -BuildDir "${{ steps.package.outputs.dir }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "::notice title=Installer tests::all installer checks passed"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: package/
          retention-days: 90

  launcher:
    runs-on: windows-latest
    timeout-minutes: 30
    # Informational for now: some launcher tests expect a particular local setup.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test launcher
        run: dotnet test source/tools/OfflineDaoc.Launcher.Tests/OfflineDaoc.Launcher.Tests.csproj -c Release
