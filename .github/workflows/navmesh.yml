# The navmesh tests (issue #684): the [Explicit] server tests of .github/navmesh-tests.txt, run against the published
# navmesh set (tools/navmesh/manifest.json names it; the files are the assets of its navmesh-vN pre-release, never in
# Git). Separate from build-and-test and not a required check, so a cold cache or a slow download never holds up a merge.
# Until a set is published the manifest is a placeholder and the test job skips with a notice. docs/CI.md, "The navmesh
# job", has the steps and how a set is made and replaced.
name: navmesh

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tools/navmesh/**'
      - '.github/navmesh-tests.txt'
      - '.github/ci-excluded-tests.txt'
      - '.github/workflows/navmesh.yml'
      - 'source/server/GameServer/world/Pathfinding/**'
      - 'source/server/GameServer/bots/autonomous/AutonomousZone*.cs'
      - 'source/server/GameServer/bots/autonomous/DragonLair*.cs'
      - 'source/server/Tests/UnitTests/UT_DragonLairProbe.cs'
      - 'source/server/Tests/UnitTests/UT_SneezerCampNavigation.cs'
      - 'source/server/Tests/UnitTests/UT_ExchangePlacementNavigation.cs'
      - 'tools/fork-build/content-patches.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navmesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The owner's packing script in Windows PowerShell 5.1 on a fake install (several parts, identical zips twice, read
  # back by navmesh_set.py, a planted mismatch refused, the install untouched), and the Python tool's own tests.
  publish-script:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: navmesh_set.py tests and check
        shell: bash
        run: |
          python -m unittest discover -s tools/navmesh/tests -v
          python tools/navmesh/navmesh_set.py check
      - name: Publish-NavmeshSet.ps1 on a fake install
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/navmesh/tests/test-publish-script.ps1
          exit $LASTEXITCODE

  navmesh:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The placeholder manifest means no set yet: a notice, and every later step is skipped (the job stays green).
      - name: Is a navmesh set published?
        id: status
        shell: bash
        run: python tools/navmesh/navmesh_set.py status tools/navmesh/manifest.json

      - name: Restore the navmesh set from the cache
        if: steps.status.outputs.published == 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: navmesh-set
          key: navmesh-set-${{ steps.status.outputs.key }}

      # A miss: the release's parts (public assets, no token), each checked by size and SHA-256, unpacked, and every file
      # checked. Saved at once, so a failing test later doesn't make the next run download it again.
      - name: Download and check the navmesh set
        if: steps.status.outputs.published == 'true' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: python tools/navmesh/navmesh_set.py fetch tools/navmesh/manifest.json --dest navmesh-set

      - name: Save the navmesh set to the cache
        if: steps.status.outputs.published == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: navmesh-set
          key: navmesh-set-${{ steps.status.outputs.key }}

      # Every run, a cache hit too: every file's size and SHA-256 against the manifest, and nothing extra. A mismatch fails.
      - name: Check every file against the manifest
        if: steps.status.outputs.published == 'true'
        shell: bash
        run: python tools/navmesh/navmesh_set.py verify tools/navmesh/manifest.json --root navmesh-set

      - uses: actions/setup-dotnet@v4
        if: steps.status.outputs.published == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Build the server tests
        if: steps.status.outputs.published == 'true'
        shell: bash
        run: |
          cp source/server/CoreServer/config/serverconfig.example.xml source/server/CoreServer/config/serverconfig.xml
          dotnet build source/server/Tests/Tests.csproj -c Release -p:SourceRevisionId=${{ github.sha }}

      # The tests load lib/Detour beside the test assembly (as the server does beside GameServer.dll) and the meshes from
      # OFFLINE_DAOC_NAV_ROOT/navmesh. They are [Explicit]: only a filter that names them runs them.
      - name: Run the navmesh tests
        if: steps.status.outputs.published == 'true'
        shell: bash
        run: |
          tests=$(python source/tools/ci_test_results.py find Tests.dll --root source/server/build/Tests/Release)
          test -n "$tests" || { echo "::error title=Navmesh tests::Tests.dll was not built"; exit 1; }
          mkdir -p "$(dirname "$tests")/lib"
          cp navmesh-set/lib/Detour.dll "$(dirname "$tests")/lib/Detour.dll"
          export OFFLINE_DAOC_NAV_ROOT="$PWD/navmesh-set"
          export OFFLINE_DAOC_PROOF_OUT="$RUNNER_TEMP/navmesh-proof.txt"
          filter=$(python tools/navmesh/navmesh_set.py filter .github/navmesh-tests.txt)
          dotnet test source/server/Tests/Tests.csproj -c Release --no-build --filter "$filter" --results-directory TestResults --logger "trx;LogFileName=navmesh.trx" || true

      # Every result on the run page; fails when an entry has no result or any test did not pass.
      - name: Navmesh test results
        if: steps.status.outputs.published == 'true'
        shell: bash
        run: python tools/navmesh/navmesh_set.py results TestResults/navmesh.trx .github/navmesh-tests.txt --cache-hit "${{ steps.cache.outputs.cache-hit == 'true' }}"

      - uses: actions/upload-artifact@v4
        if: always() && steps.status.outputs.published == 'true'
        with:
          name: navmesh-test-results
          path: TestResults/
          if-no-files-found: warn
