# The automated playtester (docs/PLAYTESTER.md) on a minimal world that needs no game files: builds the server, makes
# the world with make_test_world.py, starts a server on it and runs the scenarios that need no gamebots or quests
# (login/save/restart, chat and a group between two scripted players, character creation under the Sluaghbinder switch).
# It runs twice: on a world with the switch on (0.37b, the server's default) and on one with it off (0.37,
# make_test_world.py --class-off). Nightly, on demand, and on changes to the playtester itself. The scenarios that need
# the real release world run on the owner's PC.
name: playtester

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "source/tools/OfflineDaoc.Playtester/**"
      - "source/tools/OfflineDaoc.Playtester.Tests/**"
      - "source/tools/make_test_world.py"
      - "source/server/GameServer/packets/Client/168/CharacterCreateRequestHandler.cs"
      - "source/server/GameServer/bots/BotDeathAnimation.cs"
      - "source/server/GameServer/bots/BotCorpseTargeting.cs"
      - "source/server/GameServer/commands/gmcommands/LivingServerTestCommand.cs"
      - "source/server/GameServer/commands/playercommands/target.cs"
      - "source/server/GameServer/commands/gmcommands/jump.cs"
      - "source/server/GameServer/commands/gmcommands/JumpBotTargets.cs"
      - "source/server/GameServer/packets/Client/168/PlayerTargetHandler.cs"
      - "source/server/GameServer/mode165/**"
      - "source/server/GameServer/bots/autonomous/AutonomousBotRealmPointRewards.cs"
      - "source/tools/tests/**"
      - ".github/workflows/playtester.yml"

permissions:
  contents: read

jobs:
  minimal-world:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test make_test_world.py
        run: python3 -m unittest discover -s source/tools/tests -v

      - name: Test the playtester
        run: dotnet test source/tools/OfflineDaoc.Playtester.Tests/OfflineDaoc.Playtester.Tests.csproj -c Release

      - name: Build the server
        run: |
          cp source/server/CoreServer/config/serverconfig.example.xml source/server/CoreServer/config/serverconfig.xml
          dotnet build "source/server/Dawn of Light.sln" -c Release

      - name: Make the minimal test worlds (class on, class off)
        run: |
          python3 source/tools/make_test_world.py minimal --out "$RUNNER_TEMP/minimal.db"
          python3 source/tools/make_test_world.py minimal --class-off --out "$RUNNER_TEMP/minimal-classoff.db"
          python3 source/tools/make_test_world.py minimal --out "$RUNNER_TEMP/minimal-death.db"
          python3 source/tools/make_test_world.py minimal --companions --out "$RUNNER_TEMP/minimal-companions.db"

      - name: Run the scenarios
        run: |
          dotnet build source/tools/OfflineDaoc.Playtester -c Release
          dotnet source/tools/OfflineDaoc.Playtester/bin/Release/net10.0/OfflineDaoc.Playtester.dll run \
            --world "$RUNNER_TEMP/minimal.db" --server-dir source/server/Release \
            --scenarios login-save-restart,chat-players,group-players,class-switch --out "$RUNNER_TEMP/playtest"

      # The 0.37 edition (owner decision 8, 2026-11-15): the same server with classes / enable_sluaghbinder False
      # refuses the Sluaghbinder at character creation and keeps a character over a restart. Tests only.
      - name: Run the class-off scenarios
        if: always()
        run: |
          set -o pipefail
          dotnet source/tools/OfflineDaoc.Playtester/bin/Release/net10.0/OfflineDaoc.Playtester.dll run \
            --world "$RUNNER_TEMP/minimal-classoff.db" --server-dir source/server/Release \
            --scenarios class-switch,login-save-restart --out "$RUNNER_TEMP/playtest-classoff" | tee "$RUNNER_TEMP/classoff.txt"
          grep -q "edition: class off" "$RUNNER_TEMP/classoff.txt" || { echo "::error::the class-off world did not run the class-off rules"; exit 1; }
          grep -h "FORK_BUILD name=" "$RUNNER_TEMP"/playtest-classoff/server-console-*.log | head -n 1 | grep -q "sluaghbinder=off" \
            || { echo "::error::the class-off server's FORK_BUILD line does not say sluaghbinder=off"; exit 1; }

      # 1.2.1 bot death and rez (BotDeathAnimation, BotCorpseTargeting), on a world of its own: a GM logged in as the
      # original client (handshake build 0x2A07) and players as either client watch a /spawn companion helper die, lie
      # dead and be raised (/lstest deathanim, /lstest deathanim rez). Tests only: the packets, not what game.dll draws.
      - name: Run the bot death and rez scenarios
        if: always()
        run: |
          set -o pipefail
          dotnet source/tools/OfflineDaoc.Playtester/bin/Release/net10.0/OfflineDaoc.Playtester.dll run \
            --world "$RUNNER_TEMP/minimal-death.db" --server-dir source/server/Release \
            --scenarios bot-death,bot-corpse-target,bot-rez,bot-jump --out "$RUNNER_TEMP/playtest-death" | tee "$RUNNER_TEMP/death.txt"
          logs=("$RUNNER_TEMP"/playtest-death/server-console-*.log)
          grep -hq "CLIENT_HANDSHAKE .*build=0x2A07 client=original" "${logs[@]}" \
            || { echo "::error::no CLIENT_HANDSHAKE line took the scripted game.dll build as the original client"; exit 1; }
          grep -hq "CLIENT_HANDSHAKE .*build=0x0000 client=new-or-unknown" "${logs[@]}" \
            || { echo "::error::no CLIENT_HANDSHAKE line took build 0 as the new client"; exit 1; }
          grep -hq "BOT_DEATH_ANIM fall bot=.* original_clients=[1-9]" "${logs[@]}" \
            || { echo "::error::no BOT_DEATH_ANIM fall line with an original client"; exit 1; }
          grep -hq "BOT_DEATH_ANIM raised bot=.* original_clients=[1-9]" "${logs[@]}" \
            || { echo "::error::no BOT_DEATH_ANIM raised line with an original client"; exit 1; }
          grep -h "BOT_DEATH_ANIM \|CLIENT_HANDSHAKE" "${logs[@]}" | head -n 40 || true

      # 1.2.1 companions and rewards, on a world with an Armsman's lines and a merchant list (make_test_world.py --companions):
      # a click on a living bot (#424, PLAYER_CLICK_TARGET), /hire train by line name and the hired companion's level, gear
      # retry and training-weapon swap (#397, HIRED_COMPANION_TRAINED / _GEAR_RETRIED), and an enemy record-backed bot's kill
      # paying experience and bounty points once (#396, RVR_BOT_KILLED). Tests only: packets and log lines.
      - name: Run the companion and reward scenarios
        if: always()
        run: |
          set -o pipefail
          dotnet source/tools/OfflineDaoc.Playtester/bin/Release/net10.0/OfflineDaoc.Playtester.dll run \
            --world "$RUNNER_TEMP/minimal-companions.db" --server-dir source/server/Release \
            --scenarios bot-click-target,hire-train,gamebot-kill-xp --out "$RUNNER_TEMP/playtest-companions" | tee "$RUNNER_TEMP/companions.txt"
          logs=("$RUNNER_TEMP"/playtest-companions/server-console-*.log)
          grep -h "PLAYER_CLICK_TARGET\|HIRED_COMPANION\|RVR_BOT_KILLED\|HIRE_WORD_165" "${logs[@]}" | head -n 60 || true

      - name: Put the outcome on the run page
        if: always()
        run: |
          for r in playtest playtest-classoff playtest-death playtest-companions; do
            if [ -f "$RUNNER_TEMP/$r/report.md" ]; then
              echo "### $r" >> "$GITHUB_STEP_SUMMARY"
              sed -n '1,/^## /p' "$RUNNER_TEMP/$r/report.md" | head -n -1 >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-report
          path: |
            ${{ runner.temp }}/playtest/report.*
            ${{ runner.temp }}/playtest/server-console-*.log
            ${{ runner.temp }}/playtest-classoff/report.*
            ${{ runner.temp }}/playtest-classoff/server-console-*.log
            ${{ runner.temp }}/playtest-death/report.*
            ${{ runner.temp }}/playtest-death/server-console-*.log
            ${{ runner.temp }}/playtest-companions/report.*
            ${{ runner.temp }}/playtest-companions/server-console-*.log
          if-no-files-found: warn
