# Tests for the Wayback fetcher (tools/wayback-fetch): unit tests plus an end-to-end run against a local mock archive.
# The Windows job runs them in Windows PowerShell 5.1 (powershell.exe), the only PowerShell the owner's PC is assumed
# to have. No job contacts web.archive.org.
name: wayback-fetch

on:
  push:
    paths: ['tools/wayback-fetch/**', '.github/workflows/wayback-fetch.yml']
  pull_request:
    paths: ['tools/wayback-fetch/**', '.github/workflows/wayback-fetch.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tests in Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$PSVersionTable.PSVersion.ToString(); & '.\tools\wayback-fetch\tests\run-tests.ps1' -RequireE2E; exit $LASTEXITCODE"

  linux-pwsh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tests in PowerShell 7
        shell: pwsh
        run: ./tools/wayback-fetch/tests/run-tests.ps1 -RequireE2E
