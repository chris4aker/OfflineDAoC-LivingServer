# TEMPORARY (chore/release-gates only, removed before review): the UT_AtomicExchangePersistence fixture 50 times on
# Windows, with main's version of the test file ("before") and with this branch's ("after").
name: tmp-flaky-loop

on:
  push:
    branches: [chore/release-gates]

permissions:
  contents: read

jobs:
  loop:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Main's test file (before)
        if: matrix.version == 'before'
        shell: bash
        run: git checkout origin/main -- source/server/Tests/UnitTests/UT_AtomicExchangePersistence.cs
      - name: Build the tests
        shell: bash
        run: |
          cp source/server/CoreServer/config/serverconfig.example.xml source/server/CoreServer/config/serverconfig.xml
          dotnet build source/server/Tests/Tests.csproj -c Release -nologo -v q
      - name: 50 runs
        shell: bash
        run: |
          # cleanup = the delete in the finally (the PR #56 failure); body = anything else (e.g. "database is locked")
          pass=0; cleanup=0; body=0; warned=0
          for i in $(seq 1 50); do
            if dotnet test source/server/Tests/Tests.csproj -c Release --no-build --filter "FullyQualifiedName~UT_AtomicExchangePersistence" > run.log 2>&1; then
              pass=$((pass+1))
            elif grep -q "being used by another process" run.log; then
              cleanup=$((cleanup+1)); echo "--- run $i: cleanup failure"; grep -E -A3 "^\s*Failed |Error Message" run.log | head -n 8
            else
              body=$((body+1)); echo "--- run $i: test body failure"; grep -E -A3 "^\s*Failed |Error Message" run.log | head -n 8
            fi
            if grep -q "Warning: left the test folder" run.log; then warned=$((warned+1)); fi
          done
          left=$(ls "$TEMP" | grep -c '^daoc-atomic-exchange-' || true)
          echo "::notice title=${{ matrix.version }}: 50 runs of UT_AtomicExchangePersistence::passed $pass, cleanup failures $cleanup, test-body failures $body, runs with a left-folder warning $warned, daoc-atomic-exchange entries left in TEMP $left"
          # The fix is for the cleanup; body failures are a separate production race, reported, not hidden.
          if [ "${{ matrix.version }}" = after ] && [ $cleanup -ne 0 ]; then exit 1; fi
