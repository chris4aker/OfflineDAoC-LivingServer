# GENERATED by tools/grafana/kit.py (issue #628). Single-process Loki on local disk, 336h retention.
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: @@ROOT@@/data/loki
  storage:
    filesystem:
      chunks_directory: @@ROOT@@/data/loki/chunks
      rules_directory: @@ROOT@@/data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h
  reject_old_samples: true
  reject_old_samples_max_age: 336h
  max_query_lookback: 336h

compactor:
  working_directory: @@ROOT@@/data/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: @@ROOT@@/data/loki/rules

analytics:
  reporting_enabled: false
